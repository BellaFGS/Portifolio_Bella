name: 🎮 Deploy AllebStrix Portfolio to GitHub Pages

on:
  push:
    branches:
      - main # Executa a pipeline a cada push na branch main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-test-and-deploy:
    name: 🚀 Build, Test & Deploy Job
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clonar o repositório
      - name: 📥 Checkout repository
        uses: actions/checkout@v4.2.2

      # Step 2: Instalar o pnpm (v4.0+ já suporta runners atualizados)
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          run_install: false

      # Step 3: Configurar o Node.js 22
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: 'pnpm'

      # Step 4: Instalar dependências
      - name: 🛠️ Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Step 5: Executar a verificação estática do TypeScript
      - name: 🔎 Type check
        run: pnpm check

      # Step 6: Executar Testes Unitários
      - name: 🧪 Run Unit Tests
        run: pnpm test:unit

      # Step 7: Executar Testes de Integração
      - name: 🔗 Run Integration Tests
        run: pnpm test:integration

      # Step 8: Gerar a build de produção
      - name: 🏗️ Build project
        run: pnpm build

      # Step 9: Executar Testes de Performance
      - name: ⚡ Run Performance Tests
        run: |
          pnpm preview --port 3000 &
          npx wait-on http://localhost:3000
          pnpm test:performance

      # Step 10: Preparar os arquivos para publicação
      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3.1.0
        with:
          path: 'dist/public'

      # Step 11: Publicar no GitHub Pages
      - name: 🌐 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5