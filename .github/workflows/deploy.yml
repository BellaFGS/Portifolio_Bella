name: 🌻 Deploy Bella Portfolio to GitHub Pages

on:
  push:
    branches:
      - main # Executa a pipeline a cada push na branch main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: 🚀 Build & Deploy Job
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clonar o repositório
      - name: 📥 Checkout repository
        uses: actions/checkout@v4 # ACTION 1

      # Step 2: Instalar o pnpm
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4 # ACTION 2
        with:
          run_install: false

      # Step 3: Configurar o Node.js 22
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4 # ACTION 3
        with:
          node-version: 22
          cache: 'pnpm'

      # Step 4: Instalar dependências
      - name: 🛠️ Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Step 5: Executar a verificação do TypeScript
      - name: 🔎 Type check
        run: pnpm check

      # Step 6: Gerar a build de produção (gera em dist/public)
      - name: 🏗️ Build project
        run: pnpm build

      # Step 7: Preparar os arquivos para publicação
      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/public'

      # Step 8: Publicar no GitHub Pages
      - name: 🌐 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4